name: Build G12 English Hub APK

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 22

  - name: Setup Java
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: 21

  - name: Install Capacitor
    run: |
      npm init -y
      npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/assets

  - name: Prepare offline web assets
    run: |
      mkdir -p www
      rsync -av \
        --exclude='.git/' \
        --exclude='.github/' \
        --exclude='android/' \
        --exclude='node_modules/' \
        --exclude='www/' \
        --exclude='package.json' \
        --exclude='package-lock.json' \
        ./ www/

  - name: Create Android project
    run: |
      npx cap init "G12 English Learning Hub" \
        com.g12englishhub.app --web-dir www
      npx cap add android
      npx cap sync android

  - name: Generate Android app icons
    run: |
      mkdir -p assets
      cp images/logo.png assets/icon.png
      npx @capacitor/assets generate --android

  - name: Build Debug APK
    run: |
      cd android
      chmod +x gradlew
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK
    uses: actions/upload-artifact@v4
    with:
      name: G12-English-Hub-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
